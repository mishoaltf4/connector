<div class="card w-full sm:h-51 h-auto bg-white rounded-2xl p-4 flex max-sm:flex-col sm:justify-between gap-4">
  <div class="left flex flex-col gap-4 w-full">
    <div class="top flex justify-between">
      <div class="profile flex items-center gap-4 h-16">
        <div class="img w-16 h-16 rounded-full bg-blue-dark"></div>
        <div class="text flex-col gap-2 flex">
          <h3 class="font-bold text-2xl h-5 text-blue-dark">მარიამ დ.</h3>
          <span class="text-xl text-blue-dark">UX/UI Designer</span>
        </div>
      </div>
      <svg class="w-6 h-6 cursor-pointer" (click)="updateFavorite()">
        @if(isFavorite()){
          <use href="/svgs/favorite-filled.svg"></use>
        }@else{
          <use href="/svgs/favorite.svg"></use>
        }
      </svg>
    </div>
    <p class="text-xl text-blue-dark">დამწყები დიზაინერი</p>

    <div class="pros w-full flex items-center gap-4">
      <span class="pro py-2 px-3 rounded-2xl font-bold bg-[#E6EEFF]">Figma</span>
      <span class="pro py-2 px-3 rounded-2xl font-bold bg-[#E6EEFF]">adobe illustrator</span>
    </div>
  </div>

  <div class="right w-60 flex flex-col gap-4 text-blue">
    <div class="top font-bold">
      <p class="text-2xl"> ₾ 2,500 - 3,500</p>
      <span class="text-[16px]">საშუალო ანაზღაურება</span>
    </div>
    <div class="middle flex flex-col gap-2">
      <div class="flex items-center gap-2">
        <svg class="w-6 h-6">
          <use href="/svgs/verified.svg"></use>
        </svg>
        <p>ვერიფიცირებული</p>
      </div>
      <div class="flex items-center gap-2">
        <svg class="w-6 h-6">
          <use href="/svgs/star.svg"></use>
        </svg>
        <span>4.9  (12 პროექტი)</span>
      </div>
    </div>

    <a href="" class="mt-auto font-bold text-[#00236F]">პროფილის ნახვა</a>
  </div>
</div>
